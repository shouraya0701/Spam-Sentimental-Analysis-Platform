<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - TextGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="auth-container">
    <div class="card">
      <h1 class="card-title">Create an Account</h1>
      <p class="card-subtitle">Get started with TextGuard analysis</p>

      <div id="alert-box"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-input" type="text" id="name" required placeholder="John Doe" minlength="1" maxlength="100" />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input class="form-input" type="password" id="password" required autocomplete="new-password" placeholder="••••••••" minlength="6" maxlength="72" />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input class="form-input" type="password" id="confirm-password" required autocomplete="new-password" placeholder="••••••••" minlength="6" maxlength="72" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </main>

  <script type="module" src="/src/pages/register.js"></script>
</body>
</html>
